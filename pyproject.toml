[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "fraud-prevention"
version = "1.0"
authors = ["Diego Villamil <diego.v@bineo.com>"]
description = "Fraud Prevention with Falcon"
readme = "readme.md"
license = "MIT" 
homepage = "https://github.com/Bineo2/data-ops-fraud-prevention.git"

[tool.poetry.dependencies]
python = "==3.10.12"
# pyspark           Mejor coordinar spark a través de Databricks-Connect
# azure-identity    Ya la tenemos en EpicPy
# azure-keyvault-secrets
# azure-storage-blob    
# coverage-badge    Coverage es aparte
# delta-spark       * Databricks-Connect
# ipython   		IPython es sólo para laboratorio interno. 
# openpyxl		    * EpicPy
# pytest		    Las pruebas son aparte
# pytest-cov		Pruebas y coverage son aparte
# python-dotenv		# EpicPy
# ruff              Linter es parte
# toolz		        # EpicPy
# epic-py @ git+https://${GH_ACCESS_TOKEN}@github.com/Bineo2/data-python-tools@gh-1.12

[tool.pylint.typecheck]
ignored-modules = []

[tool.pylint."MESSAGES CONTROL"]
disable = [
  "consider-using-f-string", "missing-class-docstring", "missing-final-newline",
  "missing-function-docstring", "missing-module-docstring",
  "non-ascii-module-import", "non-ascii-name", "superfluous-parens",
  "too-few-public-methods", "trailing-whitespace", "trailing-newlines", 
  "unnecessary-lambda-assignment", "use-dict-literal", "useless-return"]

[tool.pytest.ini_options]
pythonpath = "." 
addopts = ["--import-mode=importlib",]